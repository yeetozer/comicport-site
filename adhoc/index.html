<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Install ComicPort (test build)</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f6f2; color: #1d1b18; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.65; -webkit-text-size-adjust: 100%; }
    main { width: min(680px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 64px; }
    .app { margin: 0 0 8px; font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #55504a; }
    h1 { margin: 0 0 24px; font-size: clamp(2rem, 7vw, 2.75rem); line-height: 1.1; letter-spacing: -.03em; }
    p { margin: 0 0 24px; }
    .install { display: inline-block; min-height: 56px; padding: 14px 32px; border-radius: 12px; background: #8a5428; color: #fff; font-size: 1.2rem; font-weight: 700; text-decoration: none; text-align: center; }
    .install:focus-visible { outline: 3px solid #1d1b18; outline-offset: 4px; }
    .install:active { background: #693e1b; }
  </style>
</head>
<body>
  <main>
    <p class="app">ComicPort · Version 1.0.0 · Test build 1000.3</p>
    <p>Baseline: Book Hub + shelves (21 Oct)</p>
    <h1>Install ComicPort (test build)</h1>
    <p>Open this page in Safari on your registered iPad, tap Install, then find ComicPort on the Home Screen. Only works on iPads registered for this build.</p>
    <a class="install" href="itms-services://?action=download-manifest&amp;url=https://yeetozer.github.io/comicport-site/adhoc/manifest.plist">Install</a>
  </main>
</body>
</html>
