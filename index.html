<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ComicPort</title><style>
      :root {
        color-scheme: light;
        --bg: #f7f6f2;
        --ink: #1d1b18;
        --muted: #55504a;
        --line: rgba(29, 27, 24, 0.14);
        --accent: #8a5428;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.65;
        -webkit-text-size-adjust: 100%;
      }

      main {
        width: min(680px, calc(100% - 40px));
        margin: 0 auto;
        padding: 48px 0 64px;
      }

      a {
        color: var(--accent);
      }

      .app {
        margin: 0 0 8px;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(2rem, 7vw, 2.75rem);
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      h2 {
        margin: 36px 0 8px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        font-size: 1.2rem;
        line-height: 1.25;
      }

      p {
        margin: 0 0 14px;
        font-size: 1rem;
        overflow-wrap: anywhere;
      }

      .email {
        font-size: 1.15rem;
        font-weight: 600;
      }
    </style></head><body><main><h1>ComicPort</h1><p><a href="privacy/">Privacy Policy</a></p><p><a href="support/">Support</a></p></main></body></html>
